name: rust
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      enable_cargo-semver-checks:
        description: |
          Enables cargo-semver-checks - default is true.
        required: false
        type: boolean
        default: true
      test_features:
        description: |
          JSON list of test-runs to execute in the cargo-test job.
          Each element is the full set of cargo arguments for one test
          run, e.g. '["--all-features"]' (the default) or
          '["--no-default-features", "--features std"]'. An empty
          string element means to test with no features, e.g.
          '[""]'. Tests are run for each element one by one, and
          coverage data is accumulated across all runs.
        required: false
        type: string
        default: '["--all-features"]'
      coveralls:
        description: |
          Makes cargo-test upload test coverage data to coveralls.io
          when true.
        required: false
        type: boolean
        default: false
      codecov:
        description: |
          Makes *cargo-test* upload test coverage data to codecov.io
          when true.
        required: false
        type: boolean
        default: false
      deb:
        description: Enables deb when true.
        required: false
        type: boolean
        default: false
      rpm:
        description: Enables rpm when true.
        required: false
        type: boolean
        default: false
      dependencies_debian:
        description: |
          Dependencies as Debian packages to install; used in the
          appropriate actions if defined
        type: string
      release_files:
        description: Files to publish in the github release .tar.gz
        required: false
        type: string
        default: ''
      publish_cratesio:
        description: Enables the publish-cratesio job.
        required: false
        type: boolean
        default: false
      publish_github_release:
        description: Enables the publish-github-release job.
        required: false
        type: boolean
        default: false
      publish_github_marketplace:
        description: |
          Enables publishing the github release to the github action
          marketplace when the repository is a github action.
        required: false
        type: boolean
        default: false
      publish_packagecloud_repository_deb:
        description: packagecloud repository to publish the .deb.
        required: false
        type: string
        default: ''
      publish_packagecloud_repository_rpm:
        description: packagecloud repository to publish the .rpm.
        required: false
        type: string
        default: ''
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false
      PACKAGECLOUD_TOKEN:
        required: false
jobs:
  rust-test:
    uses: ./.github/workflows/rust-test.yml
    with:
      enable_cargo-semver-checks: ${{ inputs.enable_cargo-semver-checks }}
      test_features: ${{ inputs.test_features }}
      coveralls: ${{ inputs.coveralls }}
      codecov: ${{ inputs.codecov }}
      dependencies_debian: ${{ inputs.dependencies_debian }}
      deb: ${{ inputs.deb }}
      rpm: ${{ inputs.rpm }}
  rust-deploy:
    needs: [rust-test]
    uses: ./.github/workflows/rust-deploy.yml
    with:
      deb: ${{ inputs.deb }}
      rpm: ${{ inputs.rpm }}
      dependencies_debian: ${{ inputs.dependencies_debian }}
      release_files: ${{ inputs.release_files }}
      publish_cratesio: ${{ inputs.publish_cratesio }}
      publish_github_release: ${{ inputs.publish_github_release }}
      publish_github_marketplace: ${{ inputs.publish_github_marketplace }}
      publish_packagecloud_repository_deb: ${{ inputs.publish_packagecloud_repository_deb }}
      publish_packagecloud_repository_rpm: ${{ inputs.publish_packagecloud_repository_rpm }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
