name: rust-deploy
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      deb:
        description: Enables deb when true.
        required: false
        type: boolean
        default: false
      rpm:
        description: Enables rpm when true.
        required: false
        type: boolean
        default: false
      dependencies_debian:
        description: |
          Dependencies as Debian packages to install; used in the
          appropriate actions if defined
        type: string
      release_files:
        description: Files to publish in the github release .tar.gz
        required: false
        type: string
        default: ''
      publish_cratesio:
        description: Enables the publish-cratesio job.
        required: false
        type: boolean
        default: false
      publish_github_release:
        description: Enables the publish-github-release job.
        required: false
        type: boolean
        default: false
      publish_github_marketplace:
        description: |
          Enables publishing the github release to the github action
          marketplace when the repository is a github action.
        required: false
        type: boolean
        default: false
      publish_packagecloud_repository_deb:
        description: packagecloud repository to publish the .deb.
        required: false
        type: string
        default: ''
      publish_packagecloud_repository_rpm:
        description: packagecloud repository to publish the .rpm.
        required: false
        type: string
        default: ''
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false
      PACKAGECLOUD_TOKEN:
        required: false
jobs:
  info:
    runs-on: ubuntu-latest
    outputs:
      version_tagged: ${{ steps.version.outputs.version_tagged }}
      version_commit: ${{ steps.version.outputs.version_commit }}
      basename: ${{ steps.version.outputs.basename }}
      deb_basename: ${{ steps.version.outputs.deb_basename }}
      rpm_basename: ${{ steps.version.outputs.rpm_basename }}
      arch: ${{ steps.arch.outputs.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: version
        uses: docker://lpenz/ghaction-version-gen:0.20.0
      - id: arch
        run: |
          echo 'arch=[{"runs": "ubuntu-latest", "rust": "x86_64-unknown-linux-musl", "deb": "amd64", "rpm": "x86_64" }, {"runs": "ubuntu-24.04-arm", "rust": "aarch64-unknown-linux-musl", "deb": "arm64", "rpm": "aarch64"}]' >> $GITHUB_OUTPUT
      - name: show output
        run: >-
          cat $GITHUB_OUTPUT
  release:
    needs: [info]
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.info.outputs.arch) }}
    runs-on: ${{ matrix.arch.runs }}
    container:
      image: rust:latest
      options: --platform=linux/${{ matrix.arch.deb }}
    steps:
      - name: Install dependencies
        run: >
          set -e -x;
          apt-get update;
          apt-get install -y --no-install-recommends
          musl-dev ${{ inputs.dependencies_debian }}
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.arch.rust }}
      - name: Build release with musl to avoid dependencies
        run: cargo build --release --target ${{ matrix.arch.rust }}
      - name: Create .tar.gz
        run: >
          tar -czf
          ${{ needs.info.outputs.basename }}_${{ matrix.arch.deb }}.tar.gz
          -C target/${{ matrix.arch.rust}}/release/
          ${{ inputs.release_files }}
        if: inputs.release_files
      - uses: actions/upload-artifact@v7.0.1
        if: inputs.release_files
        with:
          name: ${{ needs.info.outputs.basename }}_${{ matrix.arch.deb }}.tar.gz
          path: ${{ needs.info.outputs.basename }}_${{ matrix.arch.deb }}.tar.gz
          if-no-files-found: error
          retention-days: 2
  deb:
    needs: [info]
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.info.outputs.arch) }}
    runs-on: ${{ matrix.arch.runs }}
    container:
      image: rust:latest
      options: --platform=linux/${{ matrix.arch.deb }}
    steps:
      - name: Install dependencies
        run: >
          set -e -x;
          apt-get update;
          apt-get install -y --no-install-recommends
          musl-dev ${{ inputs.dependencies_debian }}
        if: inputs.deb
      - uses: actions/checkout@v7.0.1
        if: inputs.deb
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.deb
        with:
          target: ${{ matrix.arch.rust }}
      - name: Install cargo-deb
        uses: taiki-e/install-action@v2.85.4
        if: inputs.deb
        with:
          tool: cargo-deb
      - name: Run cargo-deb for tests only
        if: inputs.deb && needs.info.outputs.version_commit == ''
        run: >
          cargo deb --target ${{ matrix.arch.rust }}
      - name: Run cargo-deb for release
        if: inputs.deb && needs.info.outputs.version_commit != ''
        run: >
          cargo deb --target ${{ matrix.arch.rust }}
          --deb-version '${{ needs.info.outputs.version_commit }}'
      - name: Move deb to top dir
        if: inputs.deb
        run: >
          mv -v ./target/${{ matrix.arch.rust }}/debian/*.deb
          ./${{ needs.info.outputs.deb_basename }}_${{ matrix.arch.deb }}.deb
      - name: Show deb information
        if: inputs.deb
        run: >
          set -e -x;
          find . -name '*.deb';
          dpkg -I *.deb;
          dpkg -c *.deb;
      - uses: actions/upload-artifact@v7.0.1
        if: inputs.deb
        with:
          name: >
            ${{ needs.info.outputs.deb_basename }}_${{ matrix.arch.deb }}.deb
          path: >
            ${{ needs.info.outputs.deb_basename }}_${{ matrix.arch.deb }}.deb
          if-no-files-found: error
          retention-days: 2
  rpm:
    needs: [info]
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.info.outputs.arch) }}
    runs-on: ${{ matrix.arch.runs }}
    container:
      image: rust:latest
      options: --platform=linux/${{ matrix.arch.deb }}
    steps:
      - name: Install dependencies
        run: >
          set -e -x;
          apt-get update;
          apt-get install -y --no-install-recommends
          musl-dev rpm ${{ inputs.dependencies_debian }}
        if: inputs.rpm
      - uses: actions/checkout@v7.0.1
        if: inputs.rpm
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.rpm
        with:
          target: ${{ matrix.arch.rust }}
      - name: Build release with musl to avoid dependencies
        if: inputs.rpm
        run: cargo build --release --target ${{ matrix.arch.rust }}
      - name: Install cargo-generate-rpm
        uses: taiki-e/install-action@v2.85.4
        if: inputs.rpm
        with:
          tool: cargo-generate-rpm
      - name: Generate the RPM
        if: inputs.rpm
        run: >
          cargo generate-rpm --target ${{ matrix.arch.rust }} -o
          ${{ needs.info.outputs.rpm_basename }}.${{ matrix.arch.rpm }}.rpm
      - name: Show rpm info
        if: inputs.rpm
        run: >
          set -e -x;
          find . -name '*.rpm';
          rpm -qp *.rpm --info;
          rpm -qp *.rpm --requires;
          rpm -qp *.rpm --provides;
          rpm -qp *.rpm --list
      - uses: actions/upload-artifact@v7.0.1
        if: inputs.rpm
        with:
          name: ${{ needs.info.outputs.rpm_basename }}.${{ matrix.arch.rpm }}.rpm
          path: ${{ needs.info.outputs.rpm_basename }}.${{ matrix.arch.rpm }}.rpm
          if-no-files-found: error
          retention-days: 2
  ready:  # marks all deploy jobs as completed
    needs:
      - info
      - release
      - deb
      - rpm
    runs-on: ubuntu-latest
    steps:
      - name: concentrate deploy dependencies
        run: true
  publish-cratesio:
    needs: [ready, info]
    if: inputs.publish_cratesio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Publish crate on crates.io
        uses: katyo/publish-crates@v2
        if: needs.info.outputs.version_tagged != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  publish-packagecloud-deb:
    needs: [ready, info]
    if: inputs.deb && inputs.publish_packagecloud_repository_deb
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repository: ${{ fromJson(inputs.publish_packagecloud_repository_deb) }}
    steps:
      - name: Download the package generated by deb
        uses: actions/download-artifact@v8.0.1
        if: inputs.deb
        with:
          merge-multiple: true
          pattern: '*.deb'
      - name: Publish deb on packagecloud
        uses: docker://lpenz/ghaction-packagecloud:0.6.0
        if: needs.info.outputs.version_tagged != ''
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
        with:
          repository: ${{ matrix.repository }}
  publish-packagecloud-rpm:
    needs: [ready, info]
    if: inputs.rpm && inputs.publish_packagecloud_repository_rpm
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repository: ${{ fromJson(inputs.publish_packagecloud_repository_rpm) }}
    steps:
      - name: Download the package generated by rpm
        uses: actions/download-artifact@v8.0.1
        if: inputs.rpm
        with:
          merge-multiple: true
          pattern: '*.rpm'
      - name: Publish rpm on packagecloud
        uses: docker://lpenz/ghaction-packagecloud:0.6.0
        if: needs.info.outputs.version_tagged != ''
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
        with:
          repository: ${{ matrix.repository }}
  publish-github-release:
    needs: [ready, info]
    if: inputs.publish_github_release || inputs.publish_github_marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        if: inputs.publish_github_marketplace
      - name: Check that the repository is a github action
        if: inputs.publish_github_marketplace
        run: |
          if [ ! -f action.yml ] && [ ! -f action.yaml ]; then
            echo "::error::can't publish to the github action marketplace: no action.yml or action.yaml at the repository root"
            exit 1
          fi
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
      - name: Publish github release
        uses: softprops/action-gh-release@v3.0.2
        if: needs.info.outputs.version_tagged != ''
        with:
          files: '**/*'
          tag_name: ${{ needs.info.outputs.version_tagged }}
          generate_release_notes: true
